steps:
  - name: python:3.12
    entrypoint: bash
    args:
      - -c
      - |
        pip install -r requirements.txt pytest
        python -m pytest -v

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        echo "Tests passed. Deployment requires a configured billing account and IAM permissions."
        echo "Configure the deployment step only when authorized to deploy."
timeout: 1200s
